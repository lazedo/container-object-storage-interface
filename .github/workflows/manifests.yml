# Publish the install manifests as an OCI artifact pinned to this commit's
# image. Two entry points, one source of truth:
#   - called by image.yml after the image merge (the normal per-push path);
#   - Run workflow (workflow_dispatch) on a ref — the RECOVERY path: it
#     republishes the manifests for an image that already exists (e.g. after
#     registry pruning or a failed manifests step) WITHOUT rebuilding anything.
#     It verifies the image tag exists and refuses otherwise — a manifest is
#     never pointed at an image that is not on the registry, and "latest" is
#     never resolved: the pin is always this ref's GITHUB_SHA.
name: manifests

on:
  workflow_call:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: fluxcd/flux2/action@v2.9.2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Image for this commit must already exist on GHCR
        # registry API probe, not `docker manifest inspect`: the docker CLI path
        # fails against ghcr under GITHUB_TOKEN credentials even after a
        # successful login (observed on the first live run), and it hides the
        # reason; the token+manifests endpoints answer deterministically and the
        # HTTP code is surfaced in the error.
        run: |
          set -euo pipefail
          TOK=$(curl -fsSL -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:lazedo/objectstorage-controller:pull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOK}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/lazedo/objectstorage-controller/manifests/${{ steps.sha.outputs.short }}")
          [ "${CODE}" = "200" ] || { echo "::error::ghcr.io/lazedo/objectstorage-controller:${{ steps.sha.outputs.short }} is not on GHCR (HTTP ${CODE}) — run the image workflow on this ref first"; exit 1; }

      - name: Assemble manifests pinned to this commit
        run: |
          set -euo pipefail
          SHORT="${{ steps.sha.outputs.short }}"
          mkdir -p /tmp/manifests
          sed -i -E "s#(image: ghcr\.io/lazedo/objectstorage-controller):[^[:space:]]+#\\1:${SHORT}#" controller/resources/deployment.yaml
          kubectl kustomize . > /tmp/manifests/install.yaml
          grep -q "objectstorage-controller:${SHORT}" /tmp/manifests/install.yaml

      - name: Push OCI artifact
        run: |
          set -euo pipefail
          flux push artifact "oci://ghcr.io/lazedo/manifests/objectstorage-controller:${{ steps.sha.outputs.short }}" \
            --path /tmp/manifests \
            --source "${{ github.server_url }}/${{ github.repository }}" \
            --revision "${{ github.ref_name }}@sha1:${{ github.sha }}" \
            --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          if [ "${{ github.ref_name }}" = "release-0.2" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            flux tag artifact "oci://ghcr.io/lazedo/manifests/objectstorage-controller:${{ steps.sha.outputs.short }}" \
              --tag latest --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          fi
