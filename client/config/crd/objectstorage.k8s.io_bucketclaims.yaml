---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: bucketclaims.objectstorage.k8s.io
spec:
  group: objectstorage.k8s.io
  names:
    kind: BucketClaim
    listKind: BucketClaimList
    plural: bucketclaims
    singular: bucketclaim
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              bucketClassName:
                description: Name of the BucketClass
                type: string
              exclusive:
                description: |-
                  Exclusive demands this claim be the bucket's only binder, at bind time
                  and for as long as it stays bound: the Bucket records the mode of its
                  first binder, later shared claims are refused, and an exclusive claim
                  over a bucket that already has binders fails immediately.
                type: boolean
              existingBucketName:
                description: |-
                  Name of a bucket object that was manually
                  created to import a bucket created outside of COSI
                  If unspecified, then a new Bucket will be dynamically provisioned
                type: string
              protocols:
                description: |-
                  Protocols are the set of data API this bucket is required to support.
                  The possible values for protocol are:
                  -  S3: Indicates Amazon S3 protocol
                  -  Azure: Indicates Microsoft Azure BlobStore protocol
                  -  GCS: Indicates Google Cloud Storage protocol
                items:
                  type: string
                type: array
              requireNew:
                description: |-
                  lazedo: sharing semantics. The default (both false) is create-or-adopt:
                  a claim whose derived bucket name already exists binds to the existing
                  Bucket (same class/connection only) instead of pending forever.

                  RequireNew demands the bucket be born with this claim: if the Bucket
                  object or the backend bucket already exists, provisioning fails
                  immediately (Event + condition), never silently adopts.
                type: boolean
            required:
            - protocols
            type: object
          status:
            properties:
              adopted:
                description: |-
                  lazedo: Adopted is true when this claim bound to a pre-existing Bucket
                  instead of creating it — visibility against silent sharing by name
                  collision.
                type: boolean
              binders:
                description: |-
                  lazedo: Binders is the number of claims bound to the bucket as of the
                  last reconcile of this claim's binding.
                format: int32
                type: integer
              bucketName:
                description: |-
                  BucketName is the name of the provisioned Bucket in response
                  to this BucketClaim. It is generated and set by the COSI controller
                  before making the creation request to the OSP backend.
                type: string
              bucketReady:
                description: |-
                  BucketReady indicates that the bucket is ready for consumpotion
                  by workloads
                type: boolean
              conditions:
                description: |-
                  lazedo: Conditions surface terminal provisioning refusals (requireNew
                  failed, exclusivity denied) instead of a silent pending.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            required:
            - bucketReady
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
